# Free My TV (LG) settings. webos/build.py copies this file to config.properties the first time; edit that one and
# build again.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# auto (follows the TV), or a language in assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…)
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# Home screen look: auto (dark from sunset to sunrise), light or dark
theme=auto

# Apps to leave out of the shelf, All Apps and the picks, comma separated, by id or name (part of it, any case).
# For apps the TV ships that can't be uninstalled: hide_apps=rakuten
hide_apps=

# The shelf's apps in this order, comma separated, by id or name (part of it, any case), in place of the built-in
# order. Changing it here wins once over the shelf picked on the TV: shelf_apps=youtube,netflix,spotify
shelf_apps=

# true opens the home screen with the drawer already out (apps in the middle, inputs, weather and prices below), so
# nothing has to be scrolled to reach the inputs. Back closes it to the full page.
drawer_first=false
